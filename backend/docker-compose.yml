services:
  postgres:
    image: postgres:16
    container_name: crime-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crime_intelligence
      POSTGRES_USER: crime_user
      POSTGRES_PASSWORD: crime_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: crime-intelligence-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  neo4j:
    image: neo4j:5
    container_name: crime-intelligence-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/datathon
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/import
      - neo4j-plugins:/plugins

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
